<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A lifter's progress · The Hypertrophy Bible</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg:#0e1116; --card:#171c24; --line:#242c38; --text:#e8edf4; --muted:#93a0b4; --accent:#3ddc84; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
      background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px; text-align:center; }
    h1 { font-size:1.05rem; margin:0 0 20px; color:var(--muted); font-weight:600; }
    .hero { font-size:2.6rem; font-weight:800; margin:4px 0; }
    .hero .u { font-size:1rem; color:var(--muted); font-weight:600; }
    .row { display:flex; gap:12px; margin-top:20px; }
    .stat { flex:1; background:#0f141b; border:1px solid var(--line); border-radius:14px; padding:14px 8px; }
    .stat b { display:block; font-size:1.5rem; }
    .stat span { color:var(--muted); font-size:.82rem; }
    .cta { display:inline-block; margin-top:22px; color:#06210f; background:var(--accent); text-decoration:none;
      font-weight:700; padding:12px 20px; border-radius:12px; border:none; font:inherit; cursor:pointer; }
    button.cheer { display:block; width:100%; margin-top:18px; padding:12px; border-radius:12px; cursor:pointer;
      background:#0f141b; border:1px solid var(--line); color:var(--text); font-size:1rem; font-weight:600; }
    button.cheer:disabled, button.cta:disabled { opacity:.7; cursor:default; }
    .muted { color:var(--muted); }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏋️ A lifter's progress</h1>
    <div id="ok" class="hidden">
      <div class="hero">🔥 <span id="streak">0</span> <span class="u">week streak</span></div>
      <div class="row">
        <div class="stat"><b id="level">1</b><span>level</span></div>
        <div class="stat"><b id="sessions">0</b><span>sessions</span></div>
      </div>
      <button id="cheer" class="cheer">💪 Cheer them on · <span id="cheers">0</span></button>
      <a id="cta" class="cta" href="/">Start your own — free</a>
      <button id="followcta" class="cta hidden">🤝 Follow their progress</button>
      <p class="muted" style="margin-top:16px;font-size:.82rem">Built with The Hypertrophy Bible — an evidence-based training coach.</p>
    </div>
    <div id="bad" class="hidden">
      <p>This progress link isn't available.</p>
      <p class="muted">It may have been turned off by its owner.</p>
      <a class="cta" href="/">Explore the app</a>
    </div>
    <div id="loading"><p class="muted">Loading…</p></div>
  </div>
  <script>
    (async () => {
      const show = (id) => { for (const x of ["ok","bad","loading"]) document.getElementById(x).classList.toggle("hidden", x !== id); };
      const token = new URLSearchParams(location.search).get("s");
      if (!token) return show("bad");
      try {
        const r = await fetch("/api/share/" + encodeURIComponent(token));
        if (!r.ok) return show("bad");
        const d = await r.json();
        // Numbers only, set via textContent — no HTML injection surface.
        document.getElementById("streak").textContent = String(d.streak_weeks ?? 0);
        document.getElementById("level").textContent = String(d.level ?? 1);
        document.getElementById("sessions").textContent = String(d.sessions_logged ?? 0);
        const u = document.querySelector(".hero .u");
        if (u) u.textContent = (d.streak_weeks === 1 ? "week streak" : "week streak");
        // Cheer button: one per share per browser (localStorage guard), count via textContent.
        const cheersEl = document.getElementById("cheers");
        const btn = document.getElementById("cheer");
        cheersEl.textContent = String(d.cheers ?? 0);
        const key = "hb_cheered_" + token;
        let done = false; try { done = localStorage.getItem(key) === "1"; } catch {}
        if (done) { btn.disabled = true; btn.textContent = "💪 Cheered · "; btn.appendChild(cheersEl); }
        btn.onclick = async () => {
          if (btn.disabled) return;
          btn.disabled = true;
          try {
            const r = await fetch("/api/share/" + encodeURIComponent(token) + "/cheer", { method: "POST" });
            if (r.ok) { const j = await r.json(); cheersEl.textContent = String(j.cheers ?? 0); try { localStorage.setItem(key, "1"); } catch {} btn.textContent = "💪 Cheered · "; btn.appendChild(cheersEl); }
            else btn.disabled = false;
          } catch { btn.disabled = false; }
        };
        // A visitor who already has the app (same-origin localStorage) can connect
        // as a training partner in one tap instead of copy-pasting this link back
        // into the Coach tab's "paste a share link" box. A brand-new visitor still
        // gets the signup CTA, just carrying the token forward so onboarding can
        // finish the connection automatically (app.js's tryPendingFollow).
        let myUid = null; try { myUid = localStorage.getItem("hb_user"); } catch {}
        const cta = document.getElementById("cta");
        const followBtn = document.getElementById("followcta");
        if (myUid) {
          cta.classList.add("hidden");
          followBtn.classList.remove("hidden");
          followBtn.onclick = async () => {
            if (followBtn.disabled) return;
            followBtn.disabled = true;
            try {
              const fr = await fetch("/api/following", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ user_id: myUid, token }) });
              const fj = await fr.json().catch(() => ({}));
              if (fr.ok && !fj.error) followBtn.textContent = "✅ Following — see your Coach tab";
              else if (fj.error === "cannot-follow-self") followBtn.textContent = "That's your own link!";
              else { followBtn.disabled = false; followBtn.textContent = "🤝 Follow their progress"; }
            } catch { followBtn.disabled = false; }
          };
        } else {
          cta.href = "/?follow=" + encodeURIComponent(token);
        }
        show("ok");
      } catch { show("bad"); }
    })();
  </script>
</body>
</html>
