<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Confirming… — Hypertrophy Bible</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="app">
    <div class="center" style="padding-top:20vh">
      <h1 id="msg">Confirming…</h1>
      <p class="muted" id="sub"></p>
      <button class="btn" id="cont" hidden>Continue in Safari</button>
      <a class="btn" id="go" href="/" hidden>Open the app</a>
    </div>
  </main>
  <script type="module">
    // The emailed link is a GET that just loads this page; the single-use token is
    // spent here via an explicit POST, so mail-server link scanners can't burn it.
    // Adopting the account is the SAME decision tree the app's code box runs
    // (account-adopt.mjs) — one implementation, two doors.
    import { resolveAdoption, adoptionMessage, isIOSBrowserTab } from "/account-adopt.mjs";
    const msg = document.getElementById("msg");
    const sub = document.getElementById("sub");
    const go = document.getElementById("go");
    const cont = document.getElementById("cont");
    const token = new URLSearchParams(location.search).get("token");

    async function consume() {
      cont.hidden = true;
      msg.textContent = "Confirming…";
      sub.textContent = "";
      try {
        const r = await fetch("/api/auth/consume", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ token }),
        });
        const d = await r.json();
        if (!d.user_id) {
          msg.textContent = d.error === "expired" ? "That link has expired."
            : d.error === "used" ? "That link was already used."
            : "That link isn't valid.";
          sub.textContent = d.error === "used"
            ? "If you typed the code from the same email into the app, you're already signed in there."
            : "Head back to the app and request a fresh one.";
          go.hidden = false;
          return;
        }
        const res = await resolveAdoption(d, {
          current: localStorage.getItem("hb_user"),
          storage: localStorage,
          fetchJson: (path, opts = {}) => fetch(path, opts).then((x) => x.json()),
          ask: async (question) => confirm(question),
        });
        if (!res.adopted) {
          msg.textContent = "Kept this device's data.";
          sub.textContent = "Nothing was changed.";
          go.hidden = false;
          return;
        }
        const done = adoptionMessage(d, res);
        msg.textContent = done.title;
        sub.textContent = done.sub;
        go.hidden = false;
        setTimeout(() => location.replace("/"), 1800);
      } catch (e) {
        msg.textContent = "Something went wrong.";
        sub.textContent = "Please try the link again.";
        go.hidden = false;
      }
    }

    if (!token) {
      msg.textContent = "This link is missing its code.";
      go.hidden = false;
    } else if (isIOSBrowserTab({ userAgent: navigator.userAgent, platform: navigator.platform, maxTouchPoints: navigator.maxTouchPoints,
        standalone: navigator.standalone === true || window.matchMedia?.("(display-mode: standalone)").matches })) {
      // On iPhone this page opens in Safari, whose storage is separate from the
      // Home-Screen app — signing in HERE can never reach the app. And the link and
      // the code are one single-use credential, so consuming it here would kill the
      // code the app needs. Ask first.
      msg.textContent = "One more tap";
      sub.textContent = "Using the app from your Home Screen? Open it and type the 6-digit code from the email — this page can't reach the app on iPhone. Using Safari? Continue here.";
      cont.hidden = false;
      cont.onclick = consume;
    } else {
      consume();
    }
  </script>
</body>
</html>
