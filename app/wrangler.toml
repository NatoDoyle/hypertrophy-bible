# Cloudflare Workers config. Free tier covers this app end-to-end:
# Workers (100k req/day), D1 (5 GB + 5M rows read/day), static assets (unlimited).
# No credit card, no non-commercial restriction, donation button allowed.
name = "hypertrophy-bible"
main = "worker.mjs"
compatibility_date = "2025-01-01"
workers_dev = true # keep the *.workers.dev URL working alongside the custom domain

# Custom domain (the zone is on the same Cloudflare account, so wrangler
# provisions DNS + TLS automatically on deploy). The workers.dev URL keeps working too.
routes = [
  { pattern = "hypertrophybible.com", custom_domain = true },
  { pattern = "www.hypertrophybible.com", custom_domain = true },
]

# From address for magic-link email (non-secret). The API key is a secret:
#   npx wrangler secret put RESEND_API_KEY
[vars]
MAIL_FROM = "The Hypertrophy Bible <hello@hypertrophybible.com>"
# Web Push VAPID public key (raw P-256, base64url — safe to publish; the
# private half is a secret: npx wrangler secret put VAPID_PRIVATE_JWK)
VAPID_PUBLIC_KEY = "BEZ6ZmrGhbwa6F_luGpHIELORw6Xj58yoB7A7dquHBuiiuC7Xje1XXOugI6s6cz-h1SXdd8QKsD2GLXQqLFzffE"

# The sweep (worker.mjs `scheduled` → src/scheduled.mjs) ticks every 5 minutes (W285) so
# device reminders land at the times users PICK (weigh-in, training days, food log), each
# on one tick a day in their own timezone. Everything that used to run hourly still does:
# the social pushes and email-only accounts ride the first tick of each hour, and the
# comeback EMAIL sweep the 16:00-UTC one only, so its once-daily cadence is unchanged.
# At most 2 emails per lapse per user; pause/opt-out respected.
[triggers]
crons = ["*/5 * * * *"]

# Rest's up (W286): one Durable Object per user holds the end of their current rest and
# pushes "Rest's up" at that instant, even with the phone locked — the cron's minutes are
# far too coarse for a 90-second rest. SQLite-backed: the kind the Workers Free plan includes.
[[durable_objects.bindings]]
name = "REST_ALARM"
class_name = "RestAlarm"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RestAlarm"]

# Frontend: everything in ./public is served straight from Cloudflare's edge.
# The Worker (main) only runs for routes the assets don't match — i.e. /api/*.
[assets]
directory = "./public"
binding = "ASSETS"

# Durable storage. Create the DB once, then paste its id here:
#   npx wrangler d1 create hypertrophy-bible
[[d1_databases]]
binding = "DB"
database_name = "hypertrophy-bible"
database_id = "37227640-f73e-44e1-a1d3-4899c10c1fab"
